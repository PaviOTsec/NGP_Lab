network:
  # Siemens SCALANCE: five separate devices (distinct host keys), same firmware (OpenSSH 9.0).
  # Models from each WBM login page title (pre-auth, 2026-10-12): XC208G except SW-DMZ (XC416-8).
  # Every network device shares the `network/admin` credential. Logins not yet tested.
  # Onboarding to SINEC NMS (2026-10-12): visibility settings only (SNMP etc.), no network changes.
  - { name: SW-Mgmt, kind: network, os: network, segment: Mgmt, address: 192.168.100.30,
      credential: network/admin, vendor: scalance, tags: [switch, backup],
      ssh_fingerprint: "SHA256:nJej6gWfWqOYDSrobA1BcW9HXA8VAYfFJI2pnCGZ2IA" }
  - { name: SW-WAN, kind: network, os: network, segment: L5, address: 10.5.20.30,

# Lab Console: inputs on the SIEM itself.

# Receive from universal forwarders. Plain TCP for the setup phase (allow-all v1);
# switch to [splunktcp-ssl:9997] when the lab is tightened (v2).
[splunktcp://9997]
disabled = 0

# The SIEM is Splunk Enterprise, so it can't be a deployment client of itself.
# Its own event logs are collected here. Keep this list in step with
# deployment-apps\lab_windows_inputs\local\inputs.conf.
[WinEventLog://Application]
disabled = 0
index = wineventlog
renderXml = true

[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = true


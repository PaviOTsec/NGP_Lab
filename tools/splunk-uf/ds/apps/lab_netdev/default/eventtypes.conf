# CIM tagging for the SCALANCE events (the Fortinet / Palo Alto add-ons tag their own sourcetypes).
[lab_netdev_scalance_auth]
search = sourcetype=scalance:syslog event_class IN (login_success, login_failure)

[lab_netdev_scalance_change]
search = sourcetype=scalance:syslog event_class=config_change

# Lab Console (2026-10-20): hMailServer 5.7.1 on L4H1_MailServer (tools/hmailserver/README.md).
# The server writes local time and the VM runs UTC, hence TZ = UTC. Lines are tab-separated,
# values in double quotes. Seen live 2026-10-20:
#   "SMTPD"<t>15020<t>8<t>"2026-10-20 03:09:28.468"<t>"10.1.20.56"<t>"SENT: 220 mail.np.local ESMTP"
#   "IMAPD"<t>16280<t>7<t>"..."<t>"10.1.20.56"<t>"RECEIVED: LNHA1 LOGIN remoteIT@mail.np.local ***"
#   "TCPIP"<t>15020<t>"..."<t>"TCP - 10.1.20.56 connected to 10.4.20.21:587."
#   "APPLICATION"<t>16828<t>"..."<t>"SMTPDeliverer - Message 1: Delivering message from a@x to b@x. File: ..."
# Passwords are masked by the server (*** ); SMTP AUTH LOGIN usernames arrive base64-encoded.

[hmailserver]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^"[A-Z0-9]+"\t\d+\t(?:\d+\t)?"
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = none
# Session lines (SMTPD/SMTPC/IMAPD/POP3D) and server lines (TCPIP/APPLICATION/ERROR/DEBUG)
EXTRACT-lab_hmail_session = ^"(?<log_type>SMTPD|SMTPC|IMAPD|POP3D)"\t(?<thread_id>\d+)\t(?<session_id>\d+)\t"[^"]*"\t"(?<src_ip>[^"]*)"\t"(?<direction>SENT|RECEIVED): (?<message>.*)"\s*$
EXTRACT-lab_hmail_server = ^"(?<log_type>TCPIP|APPLICATION|ERROR|DEBUG)"\t(?<thread_id>\d+)\t"[^"]*"\t"(?<message>.*)"\s*$
EXTRACT-lab_hmail_imap_user = RECEIVED: \S+ LOGIN "?(?<user>[^\s"]+)"? \*\*\*
EXTRACT-lab_hmail_pop3_user = ^"POP3D".*"RECEIVED: USER (?<user>[^\s"]+)
EXTRACT-lab_hmail_tcp = "TCP - (?<src>\d{1,3}(?:\.\d{1,3}){3}) connected to (?<dest>\d{1,3}(?:\.\d{1,3}){3}):(?<dest_port>\d+)
EXTRACT-lab_hmail_delivery = Delivering message from (?<sender>\S+) to (?<recipient>.+?)\. File:
EVAL-protocol = case(log_type="SMTPD" OR log_type="SMTPC", "smtp", log_type="IMAPD", "imap", log_type="POP3D", "pop3")
EVAL-auth_result = case(match(message, "(?i)Invalid user name or password|^535 |Authentication failed|Too many invalid logon"), "failure", \
  match(message, "(?i)^\S+ OK LOGIN|^235 |^\+OK Mailbox locked"), "success")
EVAL-src = coalesce(src, src_ip)
EVAL-app = "hmailserver"
EVAL-vendor_product = "hMailServer"

# One line per delivery attempt (incl. refused ones):
#   2026-10-20 03:09:29<t>student1@mail.np.local<t>remoteIT@mail.np.local<t>10.1.20.56<t>127.0.0.1<t>SMTP<t>?<t>250<t>462
[hmailserver:awstats]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 20
KV_MODE = none
REPORT-lab_hmail_awstats = lab_hmail_awstats
# CIM Email-style names: src_user / recipient / src / action / size
EVAL-src_user = sender
EVAL-src = src_ip
EVAL-action = if(tonumber(status_code) < 400, "delivered", "blocked")
EVAL-recipient_domain = mvindex(split(recipient, "@"), 1)
EVAL-sender_domain = mvindex(split(sender, "@"), 1)
EVAL-app = "hmailserver"

[hmailserver:error]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^"[A-Z]+"\t\d+\t"
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 25

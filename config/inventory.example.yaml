# EXAMPLE = the observed lab inventory (2026-10-09). Copy to inventory.yaml to use it.
# Lab Console inventory — OBSERVED 2026-10-09 from MC01 (read-only discovery).
#
# Every address/hostname/VM name below was reported by the machines themselves:
#   hostnames  — NTLM challenge (no credentials sent) or a read-only login
#   VM names   — Get-VM on each hypervisor as HyperVAdmin
#   SSH keys   — server host key, read before authentication
# Where the drawing (NP-ARCH-001 v0.3) disagrees, the observation wins; see the DRIFT notes.
#
# SCOPE: L2 and below are deliberately excluded (safety). Do not add L2-HOST-1
# (192.168.100.13), its guests, L2BM-BNR (192.168.100.15), the cell firewall, or L1 devices.
#
# Fields: name (display), kind, os, segment, address, host, vm_name, hostname (identity pin,
# checked before any login), ssh_fingerprint (SSH pin), credential / admin_credential
# (entries in the credentials file), route, access, web_ui, vendor, tags.

credentials_hint: >
  Credential names refer to entries in the credentials file chosen in the app
  (config/credentials.example.yaml).

hypervisors:
  - name: DMZ-HOST-1
    kind: hypervisor
    os: windows
    segment: DMZ
    address: 192.168.100.12
    credential: DMZ-HOST-1/HyperVAdmin          # verified: login OK
    admin_credential: DMZ-HOST-1/CoreAdmin       # not tested (observe-only)
    tags: [hyperv]

  - name: DMZ-HOST-2
    kind: hypervisor
    os: windows
    segment: DMZ
    address: 192.168.100.16                      # DRIFT: drawing says .13 — .13 is L2-HOST-1
    credential: DMZ-HOST-2/HyperVAdmin           # verified: login OK
    admin_credential: DMZ-HOST-2/CoreAdmin
    tags: [hyperv]

  - name: L4-HOST-1
    kind: hypervisor
    os: windows
    segment: L4
    address: 192.168.100.11
    credential: L4-HOST-1/HyperVAdmin            # verified: login OK; PowerShell Direct OK
    admin_credential: L4-HOST-1/CoreAdmin
    tags: [hyperv]


targets:

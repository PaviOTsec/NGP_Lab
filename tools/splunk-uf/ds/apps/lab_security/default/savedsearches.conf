[LAB - Suspicious PowerShell script block]
description = A PowerShell script block (4104) containing download / encoded-command / AMSI-bypass / credential-theft keywords. The Lab Console's own remoting (PSRP init, LabConsole paths) and Windows troubleshooting packs (C:\Windows\TEMP\SDIAG_*) are excluded.
search = index=wineventlog (source="WinEventLog:Microsoft-Windows-PowerShell/Operational" OR source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational") EventCode=4104 _index_earliest=-5m@m _index_latest=@m \
| `lab_scriptblock_fields` \
| regex script_text="(?i)(DownloadString|DownloadFile|DownloadData|Net\.WebClient|Invoke-Expression|\bIEX\b|-enc(odedcommand)?\s|FromBase64String\(.{0,40}\)\s*\|\s*IEX|AmsiUtils|amsiInitFailed|Invoke-Mimikatz|sekurlsa|Invoke-Shellcode|Add-MpPreference\s+-Exclusion|Set-MpPreference\s+-Disable|Invoke-WmiMethod.+Win32_Process|bitsadmin|certutil.+-urlcache)" \
| eval ctx=script_text." ".coalesce(script_path, "") \
| regex ctx!="(?i)(LabConsole|\$__lc = @\(|TEMP.SDIAG_[0-9a-f]{8}-)" \
| eval snippet=substr(replace(script_text, "[\r\n\t]+", " "), 1, 300) \
| table _time host script_path snippet
alert.severity = 4
alert.suppress.fields = host,snippet
enableSched = 1
cron_schedule = 0-59/5 * * * *
dispatch.earliest_time = -24h

    kind: guest
    host: L2-HOST-1
    os: windows
    segment: L2
    address: 192.168.20.11     # PCS 7 / TIA engineering station
    tags: [pcs7, ot]

  - name: L2H1_OSC01
    kind: guest
    host: L2-HOST-1
    os: windows
    segment: L2
    address: 192.168.21.10     # PCS 7 OS client
    tags: [pcs7, ot]


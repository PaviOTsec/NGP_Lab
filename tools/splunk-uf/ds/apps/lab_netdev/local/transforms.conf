# Lab Console (2026-10-19): see props.conf in this folder.

# Index time: host = the device IP that Scribbler stored (2nd token of the bridge line).
[lab_netdev_host]
REGEX = ^\S+\s+(\d{1,3}(?:\.\d{1,3}){3})\s
FORMAT = host::$1
DEST_KEY = MetaData:Host

# Every syslog sender, including devices outside the console inventory (L2/L1 switches, OT-FW).
# Passive data only - a lookup contacts nothing.
[netdev_assets]
filename = netdev_assets.csv
case_sensitive_match = false

# Denied flows that are known and accepted (src + dest_port); used by LAB NET - Denied industrial-protocol attempt.
[netdev_deny_allowlist]
filename = netdev_deny_allowlist.csv

# Sysmon (installed by tools\sysmon\push_sysmon.py, config sysmon-modular "Balanced") -> index sysmon.
# XML rendering is required: Splunk_TA_microsoft_sysmon and the Endpoint data model expect it.
# On a host without Sysmon the forwarder logs "Failed to find Event Log" until it's installed.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = true

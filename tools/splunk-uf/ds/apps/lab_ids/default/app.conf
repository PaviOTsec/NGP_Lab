# Lab Console: IDS-sensor parsing on DMZH1_SIEM (managed from MC01 tools\splunk-uf\ds; edit there,
# re-run deploy_ds.py). Data: indexes zeek + suricata from the lab_ids_inputs forwarder app on L4H1_IDS.
# Field/CIM mapping comes from Splunk_TA_zeek (Corelight/Aplura) and Splunk_TA_CCX_Suricata; this app
# only fixes event breaking and timestamps for file-monitored JSON (the CCX TA assumes syslog).
[install]
state = enabled

[ui]
is_visible = false
label = Lab IDS

[launcher]
author = Lab Console
description = Event breaking + timestamps for Zeek JSON and Suricata EVE JSON from L4H1_IDS
version = 1.0.0

[package]
check_for_updates = false

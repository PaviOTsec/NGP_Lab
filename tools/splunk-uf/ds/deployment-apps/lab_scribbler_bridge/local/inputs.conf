# Scribbler -> Splunk (docs/SPLUNK_SCRIBBLER_PLAN.md). Index netdev is defined on the SIEM in
# apps\lab_indexes. The scripted input reads Scribbler's Elasticsearch every 60 s and writes one
# file per vendor; the monitors below read those files. Parsing (time, host, vendor sourcetypes)
# happens on the SIEM: apps\lab_netdev + the Fortinet / Palo Alto add-ons.

# Heartbeat (one JSON line per run): status, window, counts, error.
[script://.\bin\scribbler_pull.bat]
disabled = 0
interval = 60
index = netdev
sourcetype = scribbler:bridge

# SCALANCE switches + the OT firewall SC646 (RFC 5424, one line per event).
[monitor://$SPLUNK_HOME\var\lib\lab_scribbler_bridge_out\scalance]
disabled = 0
index = netdev
sourcetype = scalance:syslog
whitelist = \.log$

# FW-North (FortiOS key=value) -> the add-on splits it into fortigate_traffic / _event / _utm.
[monitor://$SPLUNK_HOME\var\lib\lab_scribbler_bridge_out\fortigate]
disabled = 0
index = netdev
sourcetype = fortigate_log
whitelist = \.log$

# FW-South (PAN-OS CSV) -> the add-on splits it into pan:traffic / pan:system / pan:config / ...
[monitor://$SPLUNK_HOME\var\lib\lab_scribbler_bridge_out\paloalto]
disabled = 0
index = netdev
sourcetype = pan:log
whitelist = \.log$

# Scribbler's own audit log (logins, settings), JSON body.
[monitor://$SPLUNK_HOME\var\lib\lab_scribbler_bridge_out\scribbler]
disabled = 0
index = netdev
sourcetype = scribbler:audit
whitelist = \.log$

# Anything the bridge could not classify (a new sender) - kept so nothing is lost.
[monitor://$SPLUNK_HOME\var\lib\lab_scribbler_bridge_out\unknown]
disabled = 0
index = netdev
sourcetype = scribbler:unknown
whitelist = \.log$

# ==== Network devices (2026-10-19, docs/SPLUNK_SCRIBBLER_PLAN.md section 4) ======================
# Index netdev (switches, OT-FW, FW-North, FW-South via Scribbler). Same window/throttle
# conventions as above. host = device IP, device = name from netdev_assets.csv.

[LAB NET - Log pipeline broken]
description = NET-01. The Scribbler -> Splunk bridge on DMZH1_LogServer sent no heartbeat for 10 minutes or reported an error (Elasticsearch unreachable, Scribbler schema changed), or a Scribbler service on the log server stopped or crashed (System 7031/7034/7036).
search = `netdev_index` sourcetype=scribbler:bridge earliest=-10m latest=now \
| stats count as heartbeats latest(status) as status latest(error) as error \
| eval problem=case(heartbeats=0, "no bridge heartbeat for 10 minutes", status!="ok", "bridge error: ".coalesce(error, status)) \
| append [ search index=wineventlog `lab_win(System)` host=DMZH1LOGSERVER EventCode IN (7031, 7034, 7036) Scribbler _index_earliest=-5m@m _index_latest=@m \
  | where EventCode!="7036" OR match(_raw, "(?i)stopped") \
  | eval problem="Scribbler service stopped or crashed (System ".EventCode.")" \
  | table _time problem ] \
| where isnotnull(problem) \
| table _time problem heartbeats
alert.severity = 5
alert.suppress.fields = problem
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 1h
alert.expires = 7d
dispatch.ttl = 2p
request.ui_dispatch_app = lab_security
request.ui_dispatch_view = search

[LAB NET - Network device stopped logging]
description = NET-02. A network device that logged in the previous 7 days has sent nothing for 48 hours: device down, syslog turned off, or the path to Scribbler broken. Runs daily. Switches log only a few events a day - tune the 48 h after a week of baseline.
search = | tstats count latest(_time) as last_seen where index=netdev sourcetype!=scribbler:bridge earliest=-7d by host \
| lookup netdev_assets ip AS host OUTPUT dvc_name AS device dvc_role \
| where isnull(dvc_role) OR dvc_role!="logserver" \
| eval hours_silent=round((now()-last_seen)/3600, 1) \
| where hours_silent>=48 \
| eval last_seen=strftime(last_seen, "%F %T") \
| table host device last_seen hours_silent
cron_schedule = 7 7 * * *
dispatch.earliest_time = -7d
alert.severity = 4
alert.suppress.fields = host
alert.suppress.period = 23h
enableSched = 1
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.expires = 7d
dispatch.ttl = 2p
request.ui_dispatch_app = lab_security
request.ui_dispatch_view = search


# Lab Console security alerts (2026-10-16). Shown in Splunk Web > Activity > Triggered Alerts
# and on the Lab Security Overview dashboard. No e-mail yet (no SMTP relay configured).
#
# Window: every alert runs on a cron (5-minute alerts staggered over minute offsets 0-4 instead of
# allow_skew, 2026-10-19: skewed dispatches counted as "Searches Delayed" in Splunk's health report)
# and looks at events INDEXED since the last run
# (_index_earliest/_index_latest), with a 24 h event-time lookback, so events a forwarder
# delivers late are still caught exactly once. alert.severity: 3 low, 4 medium, 5 high, 6 critical.
# (Common settings are repeated per stanza on purpose: a [default] stanza here would
# merge into every app's saved searches.)
# Searches match classic (WinEventLog:*) and XML (XmlWinEventLog:*) events; fields come from
# the lab_* macros, which coalesce the XML field names with the classic Message extractions.
# Throttling: per result, suppressed per alert.suppress.fields for alert.suppress.period.
# Baseline 2026-10-16 (90 days): no 1102/104/4740/1116/1117; 4732 only for service SIDs
# (forwarder installs) outside the privileged list; 7045 = Trellix + Splunk drivers.

[LAB - Brute force: repeated failed logons]
description = 5 or more failed logons (4625) for the same account from the same source on one host within the 5-minute window.
search = index=wineventlog `lab_win(Security)` EventCode=4625 _index_earliest=-5m@m _index_latest=@m \
| `lab_failed_logon_fields` \
| stats count min(_time) as first_seen max(_time) as last_seen values(reason) as reason values(logon_type) as logon_type by host user src \
| where count>=5 \
| eval first_seen=strftime(first_seen, "%F %T"), last_seen=strftime(last_seen, "%F %T")
alert.severity = 5
alert.suppress.fields = host,user,src
enableSched = 1
cron_schedule = 0-59/5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 1h
alert.expires = 7d
dispatch.ttl = 2p
request.ui_dispatch_app = lab_security
request.ui_dispatch_view = search

[LAB - Password spray: one source, many accounts]
description = One source address fails to log on as 4 or more different accounts (4625) within the 5-minute window, on any hosts.
search = index=wineventlog `lab_win(Security)` EventCode=4625 _index_earliest=-5m@m _index_latest=@m \
| `lab_failed_logon_fields` \
| where isnotnull(src) AND src!="-" \
| stats dc(user) as accounts values(user) as users values(host) as hosts count by src \
| where accounts>=4
alert.severity = 5
alert.suppress.fields = src
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -24h

# Lab Console (2026-10-16): the SIEM collects its OWN Sysmon log through the add-on's input
# (this app's precedence beats lab_siem_inputs, so the setting lives here). Forwarders get theirs
# from the deployment app lab_sysmon_inputs. Same index and rendering on both.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = false
index = sysmon
renderXml = true

# L4H1_IDS (Ubuntu 24.04, tools/ids-sensor/README.md). Logs live on the /data disk.
# Zeek writes JSON into current/ and zeekctl rotates hourly into dated folders (gzipped) - only
# current/ is read. Sourcetype bro:json; Splunk_TA_zeek on the SIEM retypes it per log file
# (conn.log -> bro:conn:json, s7comm.log -> bro:s7comm:json, ...).
[monitor:///data/zeek/logs/current/*.log]
index = zeek
sourcetype = bro:json
blacklist = (stderr|stdout|loaded_scripts|packet_filter|print)\.log$
disabled = 0

# Suricata EVE JSON (alert, anomaly, stats). logrotate rotates it daily.
[monitor:///data/suricata/eve.json]
index = suricata
sourcetype = suricata
disabled = 0

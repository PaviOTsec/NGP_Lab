# Lab Console (2026-10-21): subnet -> Purdue-style zone name, for the IDS Overview dashboard and ad-hoc
# searches (`lookup lab_zones subnet AS <ip-field> OUTPUT zone`). Edit lookups\lab_zones.csv in
# MC01 tools\splunk-uf\ds\apps\lab_security and redeploy with deploy_ds.py.
[lab_zones]
filename = lab_zones.csv
match_type = CIDR(subnet)
max_matches = 1

# Assets from config/inventory.yaml (generated by MC01 tools\splunk-uf\make_assets.py - do not hand-edit).
# key = IP, Windows host name, inventory name or VM name (lower-case); one asset per key.
# `lookup lab_assets key AS <field> OUTPUT asset zone role criticality risk_weight ot`
[lab_assets]
filename = lab_assets.csv
case_sensitive_match = false
max_matches = 1

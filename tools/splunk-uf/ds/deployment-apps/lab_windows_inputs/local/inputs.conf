# Windows event logs on every Windows forwarder -> index wineventlog (defined on the SIEM in
# apps\lab_indexes). XML rendering (since 2026-10-16): what Splunk_TA_windows, CIM and the
# Security Essentials / ESCU detections expect (classic text before that date).
# Keep in step with the SIEM's own list in apps\lab_siem_inputs\local\inputs.conf.
# Sysmon is collected by its own app (lab_sysmon_inputs, index sysmon).

[WinEventLog://Application]
disabled = 0
index = wineventlog
renderXml = true

[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = true


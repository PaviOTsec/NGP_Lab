# Lab Console (2026-10-19): network-device syslog read from Scribbler (docs/SPLUNK_SCRIBBLER_PLAN.md).
# The bridge on DMZH1_LogServer writes one line per stored syslog message:
#   <Scribbler receive time, UTC, yyyy-MM-ddTHH:mm:ss.fffZ> <device IP> <body>
# into ...\var\lib\lab_scribbler_bridge_out\<vendor>\*.log; the forwarder reads those files as
# scalance:syslog / fortigate_log / pan:log / scribbler:audit / scribbler:unknown.
#
# This file is in local\ on purpose: local\ of any app outranks default\ of every app, so the time
# settings below win over the Fortinet / Palo Alto add-ons' own (which expect the device header).
# A source:: stanza also outranks sourcetype stanzas, and the source stays the same after the
# add-ons rename the sourcetype (fortigate_log -> fortigate_traffic, pan:log -> pan:system, ...),
# so the host and asset settings here apply to every netdev event.

[source::...lab_scribbler_bridge_out...]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
# host = the device IP (2nd token), not the log server
TRANSFORMS-lab_netdev_host = lab_netdev_host
# netdev_name, purdue_level, dvc_role for every device (lookups\netdev_assets.csv). Not dvc_name:
# the Palo Alto add-on sets that itself (to the firewall's own name, PA-440).
LOOKUP-lab_netdev_asset = netdev_assets ip AS host OUTPUT dvc_name AS netdev_name purdue_level dvc_role

# Bridge heartbeat: one JSON line per run (status, es_ok, window_from/to, fetched, by_vendor, error).
[scribbler:bridge]
SHOULD_LINEMERGE = false
DATETIME_CONFIG = CURRENT
KV_MODE = json

# SCALANCE switches + the OT firewall SC646-2C (same message style):
#   <time> <ip> sev=<n> fac=<n> prog=<order number> msg=[meta sysUpTime="..."] <text>
# Templates seen live by 2026-10-19: Link up/down on P<x>.<y>, SSH: User <u> has logged in/out from <ip>,
# Device configuration changed., Time synchronized via 'NTP' ..., WBM: The session of user <u> was
# closed after <n> seconds of inactivity., SINEMA RC - ... (OT-FW). The login_failure, restart, loop,
# topology and hardware_fault patterns are from the SCALANCE event list and NOT yet seen live.
[scalance:syslog]
KV_MODE = none
EXTRACT-lab_scalance_hdr = ^\S+\s+\S+\s+sev=(?<severity_id>\d+)\s+fac=(?<facility_id>\d+)\s+prog=(?<model>\S*)\s+msg=(?:\[meta[^\]]*\]\s*)?(?<msg>.*)$
EXTRACT-lab_scalance_user = msg=.*?\b[Uu]ser\s+['"]?(?<user>[^\s'".,]+)
EXTRACT-lab_scalance_src = msg=.*?\bfrom\s+(?<src>\d{1,3}(?:\.\d{1,3}){3})
EXTRACT-lab_scalance_link = msg=.*?\bLink\s+(?<link_state>up|down)\s+on\s+(?<port>P[\d.]*\d)
EVAL-event_class = case(match(msg, "^SINEMA RC"), "remote_access", \
  match(msg, "(?i)logged in"), "login_success", \
  match(msg, "(?i)(log ?in|logon|authenticat\w*|password).{0,60}(fail|denied|invalid|incorrect|wrong|rejected)|(fail\w*|invalid|denied|rejected|wrong|incorrect).{0,60}(log ?in|logon|authenticat|password)"), "login_failure", \
  match(msg, "(?i)logged out|session .{0,40}closed"), "logout", \
  match(msg, "(?i)configuration (changed|saved|restored|loaded)|firmware"), "config_change", \
  match(msg, "(?i)(cold|warm)\s*-?\s*start|restart|reboot"), "restart", \
  match(msg, "(?i)^link (up|down)"), "link_change", \
  match(msg, "(?i)\bloop"), "loop", \
  match(msg, "(?i)\b(mrp|hrp|ring|rm state|spanning|rstp|stp|topology|standby)\b"), "topology", \
  match(msg, "(?i)fault|power (supply|change|fail|down|lost)|diagnos|signal(ing)? contact"), "hardware_fault", \
  match(msg, "(?i)time synchron"), "time_sync", \
  true(), "other")
EVAL-action = case(event_class="login_success", "success", event_class="login_failure", "failure", event_class="config_change", "modified")
EVAL-app = "scalance"
EVAL-vendor_product = "Siemens SCALANCE"
EVAL-dvc = host

# Scribbler's own audit log (JSON body after the time + IP prefix).
[scribbler:audit]
KV_MODE = none
EXTRACT-lab_scribbler_event = "EventName":\s*"(?<event_name>[^"]+)"
EXTRACT-lab_scribbler_user = "UserName":\s*"(?<user>[^"]*)"
EXTRACT-lab_scribbler_src = "OriginIp":\s*"(?:::ffff:)?(?<src>[^"]*)"
EXTRACT-lab_scribbler_level = "Level":\s*"(?<level>[^"]+)"

[scribbler:unknown]
KV_MODE = none

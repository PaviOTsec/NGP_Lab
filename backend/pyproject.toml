[project]
name = "labconsole"
version = "0.2.0"
description = "Web console, playbooks and shared clipboard for a workgroup Hyper-V OT/ICS lab (MC01)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",  # file uploads (clipboard, credentials file, file transfer)
    "pypsrp>=0.8",        # WinRM / PSRP for Windows hosts and guests
    "asyncssh>=2.14",     # SSH + SFTP for Linux guests and network devices
    "smbprotocol>=1.12",  # SMB for bulk file transfer to Windows targets
    "tomli>=2.0; python_version < '3.11'",
    # Windows-only, imported lazily so the suite installs/imports on Linux:
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
labconsole = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["clip_page/*.html", "playbooks/builtin/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

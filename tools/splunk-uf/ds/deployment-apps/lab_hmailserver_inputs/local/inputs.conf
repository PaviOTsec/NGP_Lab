# hMailServer 5.7.1 logs on L4H1_MailServer (tools/hmailserver/README.md). The server writes
# local time, and the VM's clock is UTC (parsing: lab_mail props.conf on DMZH1_SIEM).
# 5.7 masks passwords in these logs unconditionally (checked live 2026-10-20).

# Protocol log, one file per day: SMTPD / SMTPC / IMAPD / POP3D / TCPIP / APPLICATION lines.
[monitor://C:\ProgramData\hMailServer\Logs\hmailserver_20*.log]
index = mail
sourcetype = hmailserver
disabled = 0

# One line per message (and per refused delivery): sender, recipient, client IP, SMTP status, size.
[monitor://C:\ProgramData\hMailServer\Logs\hmailserver_awstats.log]
index = mail
sourcetype = hmailserver:awstats
disabled = 0

[monitor://C:\ProgramData\hMailServer\Logs\ERROR_hmailserver_*.log]
index = mail
sourcetype = hmailserver:error
disabled = 0

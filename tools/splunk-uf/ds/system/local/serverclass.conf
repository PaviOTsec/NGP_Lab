# Lab Console: deployment server classes on DMZH1_SIEM (managed from MC01 tools\splunk-uf\ds;
# edits made in Splunk Web > Agent Management land in this same file, so re-sync both ways).
# Apps live in $SPLUNK_HOME\etc\deployment-apps\. A forwarder phones home to 10.1.20.15:8089
# (set by DEPLOYMENT_SERVER at install time) and gets every app of every class it matches.
# whitelist entries match the client's hostname, IP, DNS name or clientName (case-insensitive).

[global]

# Every forwarder: where to send data.
[serverClass:lab_all_forwarders]
whitelist.0 = *

[serverClass:lab_all_forwarders:app:lab_all_outputs]
restartSplunkd = true
stateOnClient = enabled

# Every Windows forwarder: core event logs.
[serverClass:lab_windows]
whitelist.0 = *
machineTypesFilter = windows-x64

[serverClass:lab_windows:app:lab_windows_inputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:lab_windows:app:lab_sysmon_inputs]
restartSplunkd = true
stateOnClient = enabled

# The np.local domain controller: AD / DNS / DFS-R logs.
[serverClass:lab_domain_controllers]
whitelist.0 = DMZH2DC

[serverClass:lab_domain_controllers:app:lab_dc_inputs]
restartSplunkd = true
stateOnClient = enabled

# The log server: Scribbler -> Splunk bridge (network-device syslog into index netdev).
[serverClass:lab_logserver]
whitelist.0 = DMZH1LOGSERVER

[serverClass:lab_logserver:app:lab_scribbler_bridge]
restartSplunkd = true
stateOnClient = enabled

# The mail server: hMailServer logs into index mail (2026-10-20, tools/hmailserver/).
[serverClass:lab_mailserver]
whitelist.0 = L4H1MAILSERVER

[serverClass:lab_mailserver:app:lab_hmailserver_inputs]
restartSplunkd = true
stateOnClient = enabled

# The IDS sensor (Ubuntu): Zeek + Suricata logs into indexes zeek / suricata (2026-10-20, tools/ids-sensor/).
[serverClass:lab_ids_sensor]
whitelist.0 = l4h1-ids
machineTypesFilter = linux-x86_64

[serverClass:lab_ids_sensor:app:lab_ids_inputs]
restartSplunkd = true
stateOnClient = enabled

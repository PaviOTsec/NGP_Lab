# One JSON object per line in both. Index-time settings (the SIEM is the indexer; UFs don't parse).

# Suricata EVE: "timestamp":"2026-10-20T15:04:05.123456+0800". The CCX TA sets SHOULD_LINEMERGE=true
# (syslog-oriented); a file-monitored eve.json must break on every line.
[suricata]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
KV_MODE = json

# Zeek JSON (policy/tuning/json-logs): "ts":1760943845.123456 (epoch). Splunk_TA_zeek rewrites the
# sourcetype to bro:<log>:json from the file name; these index-time settings apply under bro:json.
[bro:json]
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
MAX_TIMESTAMP_LOOKAHEAD = 30

| where `lab_is_ot_src` \
| stats count min(_time) as first_seen values(dest) as dests values(dest_port) as dest_ports by device src \
| eval dests=mvjoin(mvindex(dests, 0, 9), ","), dest_ports=mvjoin(mvindex(dest_ports, 0, 14), ","), first_seen=strftime(first_seen, "%F %T")
alert.severity = 5
alert.suppress.fields = device,src
enableSched = 1
cron_schedule = 0-59/5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 1h
alert.expires = 7d
dispatch.ttl = 2p
request.ui_dispatch_app = lab_security
request.ui_dispatch_view = search

[LAB NET - Firewall critical system event]
description = NET-24. FortiOS event of level emergency/alert/critical, or PAN-OS system log of severity high/critical (HA, link, disk, licence, dataplane, ...). FortiOS logs "Configuration changed" (0100032102) at level alert - excluded here, NET-12 covers it.
search = `netdev_index` (sourcetype=fortigate_event OR sourcetype=pan:system) NOT logid=0100032102 _index_earliest=-5m@m _index_latest=@m \
| where (sourcetype="fortigate_event" AND level IN ("emergency", "alert", "critical")) OR (sourcetype="pan:system" AND severity IN ("high", "critical")) \
| eval device=coalesce(netdev_name, host), detail=coalesce(logdesc, description, msg, substr(_raw, 1, 300)) \
| table _time host device sourcetype detail
alert.severity = 5
alert.suppress.fields = host,detail
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 1h
alert.expires = 7d
dispatch.ttl = 2p
request.ui_dispatch_app = lab_security
request.ui_dispatch_view = search

# Lab Console (2026-10-16): ESCU's source macros name no index, so scheduled detections (run as
# the system user, whose default indexes are only `main`) would never see the lab data.
# Same source filters as ESCU's defaults, limited to the lab indexes.

[sysmon]
definition = (index=sysmon (source=WinEventLog:Microsoft-Windows-Sysmon/Operational OR source=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational))

[wineventlog_security]
definition = (index=wineventlog (eventtype="wineventlog_security" OR Channel="security" OR source="XmlWinEventLog:Security" OR source="WinEventLog:Security"))

[wineventlog_system]
definition = (index=wineventlog (eventtype="wineventlog_system" OR Channel="system" OR source="XmlWinEventLog:System" OR source="WinEventLog:System"))

[powershell]
definition = (index=wineventlog (source=WinEventLog:Microsoft-Windows-PowerShell/Operational OR source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational"))

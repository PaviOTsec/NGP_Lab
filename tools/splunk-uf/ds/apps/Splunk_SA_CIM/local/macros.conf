# Lab Console (2026-10-16): CIM data-model index constraints. The CIM default `()` searches only
# the role's default indexes (main), which holds no lab data - so every CIM-based detection
# (Security Essentials, ESCU) would come back empty. Windows data lives in index wineventlog.
# Sysmon (index sysmon) feeds Endpoint, Network_Traffic, Network_Resolution, Change, Malware.
# Network devices (index netdev, 2026-10-19) feed Authentication, Change, Network_Traffic.
# IDS sensor (2026-10-20): Zeek (index zeek) feeds Network_Traffic, Network_Resolution, Web,
# Certificates, Authentication, Alerts; Suricata (index suricata) feeds Intrusion_Detection, Alerts.

[cim_Authentication_indexes]
definition = (index=wineventlog OR index=netdev OR index=zeek)

[cim_Change_indexes]
definition = (index=wineventlog OR index=sysmon OR index=netdev)

[cim_Endpoint_indexes]
definition = (index=wineventlog OR index=sysmon)

[cim_Malware_indexes]
definition = (index=wineventlog OR index=sysmon)

[cim_Network_Resolution_indexes]
definition = (index=wineventlog OR index=sysmon OR index=zeek OR index=suricata)

[cim_Network_Sessions_indexes]
definition = (index=wineventlog)

[cim_Network_Traffic_indexes]
definition = (index=wineventlog OR index=sysmon OR index=netdev OR index=zeek)

[cim_Updates_indexes]
definition = (index=wineventlog)

[cim_Event_Signatures_indexes]
definition = (index=wineventlog)

[cim_Compute_Inventory_indexes]
definition = (index=wineventlog)

[cim_Performance_indexes]
definition = (index=wineventlog)

[cim_Intrusion_Detection_indexes]
definition = (index=suricata OR index=zeek)

[cim_Alerts_indexes]
definition = (index=suricata OR index=zeek)

[cim_Web_indexes]
definition = (index=zeek OR index=suricata)

[cim_Certificates_indexes]
definition = (index=zeek OR index=suricata)

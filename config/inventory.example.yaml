  - name: DMZH2_ADWSUS
    kind: guest
    host: DMZ-HOST-2
    vm_name: ADWSUS
    hostname: WSUS
    os: windows
    segment: DMZ
    address: 10.1.20.12
    credential: DMZH2_ADWSUS/Administrator       # verified: login OK (NP\Administrator)
    tags: [domain, wsus]
    # Second NIC 153.20.38.12/24 = temporary internet uplink for downloading patches;
    # connected only when needed (by design).

  - name: DMZH2_EPO
    kind: guest
    host: DMZ-HOST-2
    vm_name: EPO
    hostname: DMZH2_EPO        # UNVERIFIED: VM is Off; fix after first boot if the login says otherwise
    os: windows
    segment: DMZ
    address: 10.1.20.11
    credential: DMZH2_EPO/Administrator          # password not available yet: login will fail
    web_ui: https://10.1.20.11:8443              # ePO default console port (unverified)
    tags: [epo]

  - name: DMZH2_MaintServer
    kind: guest
    host: DMZ-HOST-2
    vm_name: MAINTSERVER
    hostname: DMZH2MAINT
    os: windows
    segment: L3                # its only IP is on Ops Mgmt 192.168.30.0/24
    address: 192.168.30.11
    credential: DMZH2_MaintServer/Administrator  # verified: login OK (NP\Administrator)
    web_ui: https://192.168.30.11                # SINEC NMS (443 and 8443 open)
    tags: [domain, sinec-nms]

  - name: DMZH2_SinemaRC
    kind: appliance
    host: DMZ-HOST-2
    vm_name: SinemaRc
    os: appliance
    segment: DMZ
    address: 10.1.20.16
    access: power-only
    web_ui: https://10.1.20.16
    tags: [sinema-rc]

  - name: DMZH2_Spare
    kind: guest
    host: DMZ-HOST-2
    vm_name: Spare(for now)    # VM is Off, no IP; power/checkpoint only until it has a role
    os: windows
    segment: DMZ
    access: power-only
    tags: [spare]

  # ------------------------------------------------------------------ L4-HOST-1
  # Direct WinRM to these guests is reset in transit (TCP 5985 opens, HTTP is dropped —
  # likely the North FW); their WinRM services are running. route: via-host goes straight to
  # PowerShell Direct through L4-HOST-1, which works (verified).
  - name: L4H1_RAC
    kind: guest
    host: L4-HOST-1
    vm_name: RemoteAccessClient
    hostname: L4H1RAC
    os: windows
    segment: L5                # WAN 10.5.20.0/24
    address: 10.5.20.10
    route: via-host
    credential: L4H1_RAC/Administrator           # verified via PowerShell Direct
    tags: [sinema-rc-client]

  - name: L4H1_Spare
    kind: guest
    host: L4-HOST-1
    vm_name: Office Workstation   # DRIFT: drawing calls 10.4.20.10 "L4H1_Spare"
    hostname: SIEMENS-PK8AC9O     # default-style hostname
    os: windows
    segment: L4
    address: 10.4.20.10
    route: via-host
    credential: L4H1_Spare/Administrator         # verified via PowerShell Direct
    tags: [office]

  - name: L4H1_MailServer
    kind: guest
    host: L4-HOST-1
    vm_name: MAILSERVER
    hostname: L4H1MAILSERVER
    os: windows
    segment: L4
    address: 10.4.20.21
    route: via-host
    credential: L4H1_MailServer/Administrator    # verified via PowerShell Direct
    tags: [mail]

  - name: L4H1_Attacker_Win
    kind: guest
    host: L4-HOST-1
    vm_name: ATTACKER
    os: windows                # temporary VM; 10.5.20.205 is this one, not Kali
    segment: L5
    address: 10.5.20.205
    access: power-only         # temporary; no credential by design
    tags: [attacker]

  - name: L4H1_Attacker_Kali
    kind: guest
    host: L4-HOST-1
    vm_name: L4H1_Attacker
    os: linux
    segment: L5
    access: power-only         # adapter attached only when needed; then set address and
                               # credential kali/kali for SSH (no PowerShell Direct on Linux)
    tags: [attacker, kali]

  # ------------------------------------------------------------------ L2-HOST-1 (OT, handle with care)
  # VM names / hostnames not yet read: fill vm_name from Get-VM and pin `hostname` before
  # adding a credential.
  - name: L2H1_OSS01
    kind: guest
    host: L2-HOST-1
    os: windows
    segment: L2
    address: 192.168.20.10     # PCS 7 OS server
    tags: [pcs7, ot]


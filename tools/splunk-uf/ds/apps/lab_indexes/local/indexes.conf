# Lab Console: indexes for forwarder data. Stored on D: (data disk), not under Program Files.
# The splunkd service runs as the virtual account NT SERVICE\Splunkd; deploy_ds.py grants it
# Modify on D:\SplunkData. A forwarder that sends to an index missing here loses the events,
# so add the index here first, then point an input at it.

# Windows event logs from every forwarder + the SIEM itself (Security, System, PowerShell, ...).
[wineventlog]
homePath   = D:\SplunkData\wineventlog\db
coldPath   = D:\SplunkData\wineventlog\colddb
thawedPath = D:\SplunkData\wineventlog\thaweddb
# 40 GB cap, 180 days retention (whichever comes first)
maxTotalDataSizeMB = 40960
frozenTimePeriodInSecs = 15552000

# Sysmon (Microsoft-Windows-Sysmon/Operational, XML) from the lab Windows hosts (2026-10-16).
# Busier than the event logs: 30 GB cap, 90 days.
[sysmon]
homePath   = D:\SplunkData\sysmon\db
coldPath   = D:\SplunkData\sysmon\colddb
thawedPath = D:\SplunkData\sysmon\thaweddb
maxTotalDataSizeMB = 30720
frozenTimePeriodInSecs = 7776000

# Network-device syslog (switches, firewalls) read from Scribbler on DMZH1_LogServer by the
# lab_scribbler_bridge deployment app (2026-10-19, docs/SPLUNK_SCRIBBLER_PLAN.md).
# Small (deny-only firewall logging): 10 GB cap, 180 days.
[netdev]
homePath   = D:\SplunkData\netdev\db
coldPath   = D:\SplunkData\netdev\colddb
thawedPath = D:\SplunkData\netdev\thaweddb
maxTotalDataSizeMB = 10240
frozenTimePeriodInSecs = 15552000

# hMailServer logs from L4H1_MailServer (lab_hmailserver_inputs, 2026-10-20, tools/hmailserver/).
# Sourcetypes hmailserver (protocol log), hmailserver:awstats (one line per message), hmailserver:error.
# Small: 5 GB cap, 180 days.
[mail]
homePath   = D:\SplunkData\mail\db
coldPath   = D:\SplunkData\mail\colddb
thawedPath = D:\SplunkData\mail\thaweddb
maxTotalDataSizeMB = 5120
frozenTimePeriodInSecs = 15552000

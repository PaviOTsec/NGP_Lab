# Field normalisation for Windows events in BOTH renderings:
#  - XML (renderXml=true, since 2026-10-16): Splunk_TA_windows extracts the EventData names
#    (TargetUserName, IpAddress, LogonType, SubjectUserName, MemberName, ServiceName, ...).
#  - classic text (the history before that): only the header is extracted, so the values are
#    pulled out of Message with rex.
# Each macro yields the same output fields either way. Use them in any search:
#   ... | `lab_failed_logon_fields`

# Matches a channel in both renderings: source = WinEventLog:<channel> or XmlWinEventLog:<channel>
[lab_win(1)]
args = channel
definition = (source="WinEventLog:$channel$" OR source="XmlWinEventLog:$channel$")
iseval = 0

[lab_failed_logon_fields]
definition = rex field=Message "Account For Which Logon Failed:\s+Security ID:\s+\S+\s+Account Name:\s+(?<c_user>[^\r\n]+)" \
| rex field=Message "Account For Which Logon Failed:\s+Security ID:\s+\S+\s+Account Name:\s+[^\r\n]+\s+Account Domain:\s+(?<c_domain>[^\r\n]+)" \
| rex field=Message "Source Network Address:\s+(?<c_src>[^\r\n]+)" \
| rex field=Message "Workstation Name:\s+(?<c_ws>[^\r\n]+)" \
| rex field=Message "Logon Type:\s+(?<c_lt>\d+)" \
| rex field=Message "Failure Reason:\s+(?<c_reason>[^\r\n]+)" \
| eval user=trim(coalesce(TargetUserName, c_user)), user_domain=trim(coalesce(TargetDomainName, c_domain)), \
       src=trim(coalesce(IpAddress, c_src)), src_workstation=trim(coalesce(WorkstationName, c_ws)), \
       logon_type=coalesce(LogonType, c_lt), reason=trim(coalesce(c_reason, Failure_Reason, SubStatus, Status)) \
| fields - c_user c_domain c_src c_ws c_lt c_reason
iseval = 0

[lab_logon_fields]
definition = rex field=Message "New Logon:\s+Security ID:\s+\S+\s+Account Name:\s+(?<c_user>[^\r\n]+)" \
| rex field=Message "Source Network Address:\s+(?<c_src>[^\r\n]+)" \
| rex field=Message "Logon Type:\s+(?<c_lt>\d+)" \
| eval user=trim(coalesce(TargetUserName, c_user)), src=trim(coalesce(IpAddress, c_src)), logon_type=coalesce(LogonType, c_lt) \
| fields - c_user c_src c_lt
iseval = 0

# 4728/4732/4756 (member added), 4720/4722/4724/4725/4726 (account), 4740 (lockout), 1102/104 (log cleared)
# XML: group events carry the GROUP in TargetUserName and the member in MemberName/MemberSid;
# account events carry the ACCOUNT in TargetUserName; 4740 has the caller computer in TargetDomainName.
[lab_account_change_fields]
definition = rex field=Message "Subject:\s+Security ID:\s+\S+\s+Account Name:\s+(?<c_actor>[^\r\n]+)" \
| rex field=Message "Member:\s+Security ID:\s+(?<c_msid>\S+)\s+Account Name:\s+(?<c_member>[^\r\n]+)" \
| rex field=Message "Group:\s+Security ID:\s+\S+\s+(?:Group|Account) Name:\s+(?<c_group>[^\r\n]+)" \
| rex field=Message "(?:New Account|Target Account|Account That Was Locked Out):\s+Security ID:\s+\S+\s+Account Name:\s+(?<c_target>[^\r\n]+)" \
| rex field=Message "Caller Computer Name:\s+(?<c_caller>[^\r\n]+)" \
| eval is_group=if(EventCode IN ("4728","4732","4756"), 1, 0) \
| eval actor=trim(coalesce(SubjectUserName, c_actor)), \
       member_sid=coalesce(MemberSid, c_msid), \
       member=trim(coalesce(if(MemberName="-", null(), MemberName), if(c_member="-", null(), c_member), member_sid)), \
       group=trim(if(is_group=1, coalesce(TargetUserName, c_group), null())), \
       target_user=trim(if(is_group=0, coalesce(TargetUserName, c_target), null())), \
       caller_computer=trim(if(EventCode="4740", coalesce(c_caller, TargetDomainName), null())) \
| fields - c_actor c_msid c_member c_group c_target c_caller is_group
iseval = 0

# Groups whose membership grants admin-level or remote access.
[lab_privileged_groups]
definition = group IN ("Administrators", "Domain Admins", "Enterprise Admins", "Schema Admins", \
  "Account Operators", "Server Operators", "Backup Operators", "Print Operators", "DnsAdmins", \
  "Group Policy Creator Owners", "Remote Desktop Users", "Remote Management Users", \
  "Hyper-V Administrators", "Cert Publishers")
iseval = 0

# 7045 (System) / 4697 (Security)
[lab_service_fields]
definition = rex field=Message "Service Name:\s+(?<c_svc>[^\r\n]+)" \
| rex field=Message "Service File Name:\s+(?<c_file>[^\r\n]+)" \
| rex field=Message "Service Account:\s+(?<c_acct>[^\r\n]+)" \
| eval service=trim(coalesce(ServiceName, c_svc)), service_file=trim(coalesce(ImagePath, ServiceFileName, c_file)), \
       service_account=trim(coalesce(AccountName, ServiceAccount, c_acct)) \
| fields - c_svc c_file c_acct
iseval = 0

# 4104 script block text + path (XML: ScriptBlockText / Path)
[lab_scriptblock_fields]
definition = rex field=Message "(?s)Creating Scriptblock text \(\d+ of \d+\):\s*(?<c_text>.*?)\s*ScriptBlock ID:" \
| rex field=Message "Path:\s+(?<c_path>[^\r\n]*)" \
| eval script_text=coalesce(ScriptBlockText, c_text, Message), script_path=trim(coalesce(Path, c_path)) \
| fields - c_text c_path
iseval = 0

# ---- Network devices (index netdev, 2026-10-19; docs/SPLUNK_SCRIBBLER_PLAN.md) ----------------
# Data: switches + OT-FW (sourcetype scalance:syslog, fields from apps\lab_netdev), FW-North
# (fortigate_traffic / fortigate_event, Fortinet add-on), FW-South (pan:system / pan:config /
# pan:traffic, Palo Alto add-on). host = device IP; netdev_name / purdue_level from netdev_assets.csv.
# The firewalls log DENIED traffic only (operator, 2026-10-19).

[netdev_index]
definition = index=netdev
iseval = 0

# Failed admin logins. SCALANCE wording is not yet seen live (pattern in lab_netdev props.conf);
# FortiOS logid 0100032002 = "Admin login failed"; PAN-OS system log eventid auth-fail.
[lab_net_auth_failures]
definition = `netdev_index` ((sourcetype=scalance:syslog event_class=login_failure) \
  OR (sourcetype=fortigate_event (logid=0100032002 OR (action=failure vendor_action=login))) \
  OR (sourcetype=pan:system ("auth-fail" OR "failed authentication")))
iseval = 0

[lab_net_auth_fields]
definition = rex "From: (?<c_src>\d{1,3}(?:\.\d{1,3}){3})" \
| rex "for user '(?<c_user>[^']+)'" \
| eval src=coalesce(if(match(src, "^\d{1,3}(\.\d{1,3}){3}$"), src, null()), srcip, c_src), user=coalesce(user, c_user), \
       device=coalesce(netdev_name, host) \
| fillnull value="?" src purdue_level \
| fields - c_src c_user
iseval = 0

# Configuration changes. FortiOS 0100044544-47 = path / object / attribute configured,
# 0100032102 = "Configuration changed"; every PAN-OS config log line (set/edit/delete/commit).
[lab_net_changes]
definition = `netdev_index` ((sourcetype=scalance:syslog event_class=config_change) \
  OR (sourcetype=fortigate_event logid IN (0100044544, 0100044545, 0100044546, 0100044547, 0100032102)) \
  OR sourcetype=pan:config)
iseval = 0

[lab_net_change_fields]
definition = rex "cfgpath=\"?(?<c_cfgpath>[^\" ]+)" \
| rex "cfgobj=\"(?<c_cfgobj>[^\"]*)\"" \
| rex "cfgattr=\"(?<c_cfgattr>[^\"]*)\"" \
| rex "\bui=\"?(?<c_ui>[^\" ]+)" \
| eval device=coalesce(netdev_name, host), user=coalesce(admin, user), via=coalesce(c_ui, client), \
       what=case(sourcetype="pan:config", trim(coalesce(cmd, "")." ".coalesce(path, configuration_path, "")), \
                 sourcetype="fortigate_event", trim(coalesce(c_cfgpath, logdesc, "")." ".coalesce(c_cfgobj, "")." ".coalesce(c_cfgattr, "")), \
                 true(), msg) \
| fillnull value="?" purdue_level \
| fields - c_cfgpath c_cfgobj c_cfgattr c_ui
iseval = 0

# Denied traffic (CIM action=blocked from the add-ons): FW-North implicit / local-in deny,
# FW-South interzone-default. Accepted traffic is not logged (FW-North may still send a few
# interim accept logs for sessions opened before 2026-10-19 - excluded by action=blocked).
[lab_net_denies]
definition = `netdev_index` (sourcetype=fortigate_traffic OR sourcetype=pan:traffic) action=blocked
iseval = 0

[lab_net_deny_fields]
definition = eval device=coalesce(netdev_name, host), src=coalesce(src_ip, src), dest=coalesce(dest_ip, dest), \
       dest_port=coalesce(dest_port, dstport), transport=coalesce(transport, protocol) \
| fillnull value="?" src dest dest_port transport
iseval = 0

# Industrial protocols: S7 102, Modbus 502, IEC 104 2404, OPC UA 4840, DNP3 20000,
# PROFINET 34962-34964, EtherNet/IP 44818, BACnet 47808.
[lab_ot_ports]
definition = dest_port IN (102, 502, 2404, 4840, 20000, 34962, 34963, 34964, 44818, 47808)
iseval = 0

# OT address space (L1 192.168.1-4.0/24, L2 192.168.20.0/24) - for `where`.
[lab_is_ot_src]
definition = (cidrmatch("192.168.1.0/24", src) OR cidrmatch("192.168.2.0/24", src) OR cidrmatch("192.168.3.0/24", src) \
  OR cidrmatch("192.168.4.0/24", src) OR cidrmatch("192.168.20.0/24", src))
iseval = 0

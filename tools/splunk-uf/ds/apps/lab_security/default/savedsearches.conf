[LAB - Forwarder silent for 15 minutes]
description = A host that reported in the last 7 days has sent nothing (no _internal, no wineventlog) for 15 minutes: forwarder stopped, host down, or network path broken.
search = | tstats latest(_time) as last_seen where (index=_internal OR index=wineventlog) earliest=-7d by host \
| eval minutes_silent=round((now()-last_seen)/60, 0) \
| where minutes_silent>=15 \
| eval last_seen=strftime(last_seen, "%F %T") \
| table host last_seen minutes_silent
cron_schedule = 2-59/15 * * * *
dispatch.earliest_time = -7d
alert.severity = 4
alert.suppress.fields = host
alert.suppress.period = 4h
enableSched = 1
